name: Casio deal check

on:
  # schedule:
  #   - cron: "*/15 * * * *"   # every 15 minutes - kind to the site and well within free minutes
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write            # needed so the job can commit seen_deals.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check required files
        run: |
          for f in watch_alert.py item_watch.py tracked_items.json; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Send one alert when a tracked item is first seen (baseline), so
          # item-alert delivery is immediately visible on phone/email.
          ITEM_ALERT_ON_BASELINE: "true"
          # Store login - optional, the public feed already carries sale prices.
          SHOP_EMAIL: ${{ secrets.SHOP_EMAIL }}
          SHOP_PASSWORD: ${{ secrets.SHOP_PASSWORD }}
          # Optional - raw Cookie headers so tracked items use YOUR logged-in
          # (personalised / offer-applied) prices instead of the public ones.
          FLIPKART_COOKIE: ${{ secrets.FLIPKART_COOKIE }}
          AMAZON_COOKIE: ${{ secrets.AMAZON_COOKIE }}
          # Email is optional - only set these secrets if you want email alerts too.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 watch_alert.py --once

      - name: Save seen-deals state
        if: always()          # still persist state even if the watcher step failed
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          # Only stage the state files that actually exist - tracked_prices.json
          # is absent until the first successful item check, and `git add` on a
          # missing path is a fatal error under `bash -e`.
          for f in seen_deals.json tracked_prices.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update seen deals"
            # Another run may have pushed since checkout; rebase and retry once.
            git pull --rebase --autostash || true
            git push
          fi
          echo "--- state files in repo after this run ---"
          ls -l seen_deals.json tracked_prices.json 2>&1 || true
